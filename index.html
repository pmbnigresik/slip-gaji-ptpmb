<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Karyawan PT PMB</title>
    <!-- Library Supabase & html2pdf -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* BACKGROUND WALLPAPER */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, Arial; 
            background: url('background.jpg') no-repeat center center fixed; 
            background-size: cover; 
            margin: 0; 
            padding: 20px; 
        }
        
        /* ========================================= */
        /* DESAIN HALAMAN LOGIN (KARTU MODERN)       */
        /* ========================================= */
        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 85vh; }
        .login-card { width: 100%; max-width: 420px; background: rgba(255, 255, 255, 0.95); border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); overflow: hidden; backdrop-filter: blur(5px); }
        
        .login-header { background: #38bdf8; color: white; text-align: center; padding: 30px 20px; }
        .login-header img { max-height: 125px; margin-bottom: 12px; } 
        .login-header h2 { margin: 0 0 5px 0; font-size: 22px; font-weight: bold; }
        .login-header p { margin: 0; font-size: 13px; color: #f0f9ff; }
        
        /* Ruang kosong disesuaikan setelah teks "Akses E-slip" dihapus */
        .login-body { padding: 40px 30px 30px 30px; } 
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #4b5563; font-weight: bold; margin-bottom: 8px; text-align: left; }
        
        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper svg.icon-left { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; fill: #9ca3af; }
        .input-icon-wrapper svg.icon-right { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; fill: #9ca3af; cursor: pointer; transition: fill 0.2s; }
        .input-icon-wrapper svg.icon-right:hover { fill: #38bdf8; }
        
        .input-icon-wrapper input { width: 100%; padding: 12px 42px 12px 42px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none; transition: border-color 0.2s; color: #374151; }
        .input-icon-wrapper input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        .input-icon-wrapper input::placeholder { color: #9ca3af; }
        
        .btn-login { width: 100%; padding: 14px; background: #38bdf8; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn-login:hover { background: #0284c7; }
        .btn-login:disabled { background: #9ca3af; cursor: not-allowed; }
        
        .pesan-error { color: #dc2626; display: none; margin-top: 15px; font-size: 13px; text-align: center; font-weight: bold; background: #fee2e2; padding: 10px; border-radius: 6px; }
        
        .login-footer { background: #f8fafc; padding: 15px; text-align: center; border-top: 1px solid #f1f5f9; font-size: 12px; color: #64748b; }

        /* ========================================= */
        /* DESAIN HALAMAN DASHBOARD (BARU)           */
        /* ========================================= */
        #dashboard-section { display: none; max-width: 700px; margin: 5vh auto 0; background: rgba(255, 255, 255, 0.95); padding: 30px; box-shadow: 0 0 15px rgba(0,0,0,0.15); border-radius: 10px; backdrop-filter: blur(5px); }
        .btn-outline { background: transparent; border: 2px solid #333; padding: 8px 16px; border-radius: 4px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-outline:hover { background: #f1f5f9; }

        /* ========================================= */
        /* DESAIN SLIP GAJI (SUPER RAPAT & PDF)      */
        /* ========================================= */
        #slip-section { display: none; max-width: 850px; margin: 0 auto; background: rgba(255, 255, 255, 0.95); padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; backdrop-filter: blur(5px); }
        .slip-box { border: 2px solid #000; padding: 10px; background: #fff; font-family: Arial, sans-serif; } 
        
        .header-top { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 6px; font-weight: bold; font-size: 15px; }
        .badge-satu { background: #000; color: #fff; padding: 3px 12px; font-size: 16px; }
        
        .grid-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 2px; }
        .col-info-1 { width: 55%; }
        .col-info-2 { width: 42%; }
        
        .slip-box table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .slip-box td { padding: 1px 0; vertical-align: top; line-height: 1.2; } 
        
        .tabel-rincian table td { white-space: nowrap; }
